[package]
name = "webapps"
version = "4.0.0"
edition = "2024"
description = "Manage web apps in a quick way."
license = "GPL-3.0-only"
repository = "https://github.com/cosmic-utils/web-apps"

[build-dependencies]
dirs = "6.0.0"
dircpy = "0.3.21"

[dependencies]
# core
libcosmic = { git = "https://github.com/pop-os/libcosmic.git", features = ["a11y", "about", "winit", "multi-window", "wayland", "tokio"]}

anyhow = "1"
ashpd = { version = "0.13.3", features = [
    "wayland",
    "file_chooser",
] }

clap = { version = "4.5.60", features = ["derive"] }
dircpy = "0.3.21"
dirs = "6.0.0"
i18n-embed-fl = "0.10.0"
i18n-embed = { version = "0.16.0", features = [
    "fluent-system",
    "desktop-requester",
] }
once_cell = "1.21.3"
open = "5.3.3"
rand = "0.10.0"
ron = "0.12.0"
rust-embed = "8.11.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = "0.28.0"
strum_macros = "0.28.0"
svg = "0.18.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", default-features = false, features = [
    "std",
    "fmt",
    "env-filter",
] }
url = "2.5.8"
urlencoding = "2.1.3"
usvg = "0.47.0"
walkdir = "2.5.0"
